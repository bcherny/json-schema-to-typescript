name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test
      env:
        CI: true

  # Aggregate check. Branch protection requires this one job instead of each
  # matrix job by name, so the matrix can change without editing the required
  # status checks.
  ci-ok:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Fail if any matrix job did not succeed
      run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
